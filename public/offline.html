<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#334155" />
  <title>インターネットに つながっていません | 100マス計算</title>
  <!--
    この画面は「ネットにつながらず、アプリ本体も手元にない」ときに出る（§3-4）。
    そのため外部の資産にも JavaScript にも一切頼らない。
    文字も色も自前で持ち、読み込み直しは <a href> で行う。
    （インライン onclick は CSP に引っかかるので使わない）
  -->
  <style>
    :root {
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
    }

    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(24px + var(--safe-t)) calc(20px + var(--safe-r))
               calc(24px + var(--safe-b)) calc(20px + var(--safe-l));
      background: #f1f5f9;
      color: #1e293b;
      line-height: 1.8;
      /* アプリ本体と同じ並び。Web フォントが届かない状況で出る画面なので、
         端末側の日本語フォントだけで組む */
      font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic UI",
                   "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
    }

    @supports not (min-height: 100dvh) {
      body { min-height: 100vh; }
    }

    .card {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 16px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, .1);
      max-width: 26rem;
      width: 100%;
      padding: 28px 24px;
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(20px, 4vw + 10px, 26px);
      color: #1e293b;
    }

    p {
      margin: 0 0 20px;
      font-size: clamp(15px, 1.6vw + 10px, 18px);
      color: #475569;
    }

    .mark {
      font-size: 44px;
      line-height: 1;
      margin-bottom: 12px;
    }

    a.retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      min-width: 12rem;
      padding: 10px 24px;
      border-radius: 12px;
      background: #334155;
      color: #ffffff;
      font-weight: 700;
      font-size: 17px;
      text-decoration: none;
    }

    a.retry:focus-visible {
      outline: 3px solid #1d4ed8;
      outline-offset: 2px;
    }

    rt { font-size: .6em; color: inherit; font-weight: 500; }

    @media (forced-colors: active) {
      .card { border: 2px solid CanvasText; }
      a.retry { border: 2px solid ButtonText; }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="mark" aria-hidden="true">📡</div>
    <h1>いま インターネットに つながっていません</h1>
    <p>
      Wi-Fi が つながっているか たしかめてから、<br />
      下の ボタンを おしてください。
    </p>
    <a class="retry" href="./">もういちど <ruby>開<rp>(</rp><rt>ひら</rt><rp>)</rp></ruby>く</a>
  </main>
</body>

</html>
